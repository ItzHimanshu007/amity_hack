<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nagar Naadi — what's happening near you</title>
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- Always visible while any event has is_simulated: true. See CONTRACT.md H. -->
<div id="simulated-banner"><!-- "Simulated data" marker --></div>

<main id="resident-view">

  <!-- EN/हिंदी toggle. Swaps framing_text/headline/chain text and the static
       UI strings table — not a full i18n framework, see js/resident.js. -->
  <div id="lang-toggle"></div>

  <!-- The whole first screen: one status word, one line of context, one
       freshness line, English over Hindi. DESIGN.md §1. No map above the fold.
       Always driven by the city-wide roll-up (never a per-area figure — see
       js/resident.js for why: /state does not yet expose a per-cell roll-up,
       and DESIGN.md §1 pins this block to the `city` block regardless). -->
  <section id="status-block"></section>

  <!-- Which area a resident cares about. Filters situation-list and picks
       which situation's one-line summary/suggested action is shown below. -->
  <section id="area-picker"></section>

  <!-- "Alert me about <area>": in-page alert + optional browser notification
       when a situation in that landmark area starts or escalates. -->
  <section id="area-alerts"></section>

  <!-- One-sentence summary + one suggested action for the picked/top
       situation, and the condensed "Why do we think this?" timeline. -->
  <section id="situation-summary"></section>

  <!-- Situation cards in plain language. Resident view never shows an H3 index. -->
  <section id="situation-list"></section>

  <!-- DESIGN.md §7. Showing our own probable false positives, labelled. -->
  <section id="unrelated-section"></section>

</main>

<script type="module" src="js/resident.js"></script>
</body>
</html>
